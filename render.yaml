services:
  - type: web
    name: saaschool-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: back
    buildCommand: pnpm install --prod=false && pnpm run render-build
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TZ
        value: America/Lima
      - key: DATABASE_URL
        fromDatabase:
          name: saaschool-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FILES_SIGNING_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MAIL_DAILY_LIMIT
        value: "400"
      - key: PUBLIC_API_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      # Imágenes optimizadas a la vez. 2 para Starter (512 MB); súbelo al cambiar de plan.
      - key: IMAGE_CONCURRENCY
        value: "2"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Verificación en dos pasos del SUPER_ADMIN: pásalo a "true" después de enrolar las cuentas
      - key: SUPERADMIN_REQUIRE_MFA
        value: "false"
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Tope de correos de formularios públicos por colegio: sin definir mientras haya un solo colegio
      - key: PUBLIC_FORM_DAILY_LIMIT_PER_SCHOOL
        sync: false

databases:
  - name: saaschool-db
    plan: basic-256mb
    region: oregon
    databaseName: saaschool
    user: saaschool
    postgresMajorVersion: "18" # versión real del servidor en Render (18.6)
